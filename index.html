<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Taquetrón. One file, pixel art on a 320x180 buffer, Canvas 2D, Web Audio.
// ---------------------------------------------------------------------------

const TUNING = {
  shiftSeconds: 30,
  strikesToClose: 5,
  customerEveryStart: 2.0,
  customerEveryEnd: 1.3,
  patienceStart: 11,
  patienceEnd: 8,
  patiencePerExtraTaco: 4,
  tortillaReady: 0,
  tortillaBurn: Infinity,  // the comal is scenery now: tortillas never burn
  tortillaRespawn: 0.6,
  salsaUses: 9999,
  salsaRefill: 0.7,
  pinaFlight: 0.8,
  pinaWindow: [0.62, 0.95],
  hitstopCatch: 0.07,
  hitstopServe: 0.04,
  shakeMax: 3,
  baseTip: 15, speedTip: 12, pinaTip: 10,
  wrongPatience: 0.15,
  burnPenalty: 3,
};

// --------------------------------------------------------------------------- canvas
const LW = 320, LH = 180;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const g = lo.getContext('2d');
let scale = 4, offX = 0, offY = 0, dpr = 1;
let bg = null;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(window.innerWidth * dpr); cv.height = Math.round(window.innerHeight * dpr);
  const s = Math.min(cv.width / LW, cv.height / LH);
  scale = s >= 2 ? Math.floor(s) : s;
  offX = Math.round((cv.width - LW * scale) / 2); offY = Math.round((cv.height - LH * scale) / 2);
}
window.addEventListener('resize', resize);

// --------------------------------------------------------------------------- rng / math
let seed = 1;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rr(a, b) { return a + (b - a) * rnd(); }
function ri(a, b) { return Math.floor(rr(a, b + 1)); }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const R = Math.round;

// --------------------------------------------------------------------------- sprites
function spr(map, pal, x, y, s, alpha) {
  s = s || 1; x = R(x); y = R(y);
  if (alpha !== undefined) g.globalAlpha = alpha;
  for (let j = 0; j < map.length; j++) {
    const row = map[j];
    for (let i = 0; i < row.length; i++) {
      const ch = row[i]; if (ch === '.') continue;
      g.fillStyle = pal[ch]; g.fillRect(x + i * s, y + j * s, s, s);
    }
  }
  g.globalAlpha = 1;
}
const ICON = {
  pastor: { map: ['..1221..', '.122221.', '12232221', '12222321', '12322221', '.122221.', '..1111..', '........'], pal: { 1: '#8a2a0c', 2: '#e8501a', 3: '#ffa300' } },
  suadero: { map: ['........', '.11111..', '1222221.', '12332221', '12222331', '.1222221', '..11111.', '........'], pal: { 1: '#7a4a26', 2: '#c98b52', 3: '#f6d29a' } },
  bistec: { map: ['........', '.111111.', '12222221', '13131311', '12222221', '11313131', '.111111.', '........'], pal: { 1: '#3a1e0e', 2: '#6b3a1c', 3: '#140904' } },
  cebolla: { map: ['...44...', '...44...', '..1111..', '.122221.', '12233221', '12233221', '.122221.', '..1111..'], pal: { 1: '#8a6fa0', 2: '#e8dcf2', 3: '#ffffff', 4: '#5a7a2a' } },
  cilantro: { map: ['.11..11.', '1221.121', '.1221221', '..13.31.', '.11.3...', '1221.3..', '.11...3.', '.......3'], pal: { 1: '#0b6b34', 2: '#2fd35a', 3: '#6b8e23' } },
  verde: { map: ['...11...', '..1221..', '.122221.', '.122221.', '12222221', '12232221', '.122221.', '..1111..'], pal: { 1: '#1f6b2a', 2: '#5bd15b', 3: '#d4ffd0' } },
  roja: { map: ['...11...', '..1221..', '.122221.', '.122221.', '12222221', '12232221', '.122221.', '..1111..'], pal: { 1: '#6e0a12', 2: '#ff2b3a', 3: '#ffc0c0' } },
  pina: { map: ['..3.3...', '...33...', '..1111..', '.124421.', '.142241.', '.124421.', '.142241.', '..1111..'], pal: { 1: '#9a5a00', 2: '#ffd23f', 3: '#2fd35a', 4: '#f08a00' } },
};
// larger hand-drawn sprites for the bins, the trompo and the flying pineapple
const BIG = {
  pina: { map: [
    '....a..a....', '...aba.ba...', '..abcbabca..', '...abbcba...', '....abba....', '...dddddd...',
    '..deffefed..', '.deffeffeed.', '.dfefffeffd.', '.deffefffed.', '.dfeffeffed.', '.deffefffed.',
    '.dfefffefed.', '..deffeffd..', '...dddddd...'],
    pal: { a: '#0b6b34', b: '#2fd35a', c: '#a3e635', d: '#9a5a00', e: '#f08a00', f: '#ffd23f' } },
  cebolla: { map: [
    '.....aa.....', '....abba....', '....abba....', '...cddddc...', '..cdeeeedc..', '.cdeeffeedc.',
    '.cdeffffedc.', '.cdeeffeedc.', '..cdeeeedc..', '...cddddc...', '....cccc....', '...g.g.g....'],
    pal: { a: '#5a7a2a', b: '#8fbf4a', c: '#8a6fa0', d: '#d8c8e8', e: '#f4eefa', f: '#ffffff', g: '#c2a878' } },
  cilantro: { map: [
    '..aa....aa..', '.abba..abba.', '.abbba.abba.', '..abba.aba..', '...a.c.ca...', '.aa..c.c....',
    'abba.cc.....', 'abbbacc.aa..', '.abbc..abba.', '...c...abba.', '..c.....aa..', '.c..........'],
    pal: { a: '#0b6b34', b: '#2fd35a', c: '#6b8e23' } },
};
const NAME = { pastor: 'PASTOR', suadero: 'SUADERO', bistec: 'BISTEC', cebolla: 'CEBOLLA', cilantro: 'CILANTRO', verde: 'VERDE', roja: 'ROJA', pina: 'PIÑA' };
const KIND = { pastor: 'meat', suadero: 'meat', bistec: 'meat', cebolla: 'top', cilantro: 'top', verde: 'salsa', roja: 'salsa', pina: 'pina' };
const KEY = { pastor: 'A', suadero: 'S', bistec: 'D', cebolla: 'F', cilantro: 'G', verde: 'Q', roja: 'W', pina: 'E' };
const NUMKEY = {};
const MEATS = ['pastor', 'suadero', 'bistec'];
const CHUNK = {
  cebolla: ['#f4eefa', '#c2c3c7', '#8a6fa0'],
  cilantro: ['#2fd35a', '#0b6b34', '#00e436'],
  pina: ['#ffec27', '#f08a00', '#b06a00'], // colours scattered on the taco
  pastor: ['#e8501a', '#b8320f', '#ffa300', '#8a2a0c'],
  suadero: ['#c98b52', '#f6d29a', '#a8703e', '#e3b07a'],
  bistec: ['#4a2512', '#6b3a1c', '#140904', '#5a2e17'],
};

// --------------------------------------------------------------------------- layout (low-res units)
const SLOTS = [100, 160, 220, 280];
const SLOT_KEYS = ['J', 'K', 'L', 'Ñ'];
const COMAL = { x: 50, y: 92, w: 88, h: 26, spots: [66, 94, 122], sy: 104 };
const BOARD = { x: 146, y: 88, w: 70, h: 38, cx: 181, cy: 107 };
const TRASH = { x: 290, y: 94, w: 26, h: 32, bump: 0 };
const TROMPO = { x: 6, y: 56, w: 38, h: 88, bump: 0 };
const PINA_SPOT = { x: 25, y: 40 };
const PINA_HIT = { x: 4, y: 14, w: 42, h: 42 };
const DIFFS = {
  facil:   { flight: 1.05, win: [0.35, 1.0], label: 'FÁCIL',   desc: 'CARNE Y PIÑA',             bins: ['pastor', 'pina', 'suadero', 'bistec'], tops: false, salsa: false, pat: 0, rate: 1, bpm: 0 },
  medio:   { flight: 0.9, win: [0.5, 0.98], label: 'MEDIO',   desc: '+ CEBOLLA Y CILANTRO',     bins: ['pastor', 'pina', 'suadero', 'bistec', 'cebolla', 'cilantro'], tops: true, salsa: false, pat: 2, rate: 0.85, bpm: 8 },
  dificil: { flight: 0.8, win: [0.62, 0.95], label: 'DIFÍCIL', desc: '+ SALSAS',                 bins: ['pastor', 'pina', 'suadero', 'bistec', 'cebolla', 'cilantro', 'verde', 'roja'], tops: true, salsa: true, pat: 3, rate: 0.72, bpm: 16 },
};
let diff = 'facil';
try { if (DIFFS[localStorage.getItem('taquerotron.diff')]) diff = localStorage.getItem('taquerotron.diff'); } catch (e) {}
let BINS = [];
function setupBins() {
  const ids = DIFFS[diff].bins, gap = 4, w = Math.floor((264 - gap * (ids.length - 1)) / ids.length);
  BINS = ids.map((id, i) => ({ id, x: 52 + i * (w + gap), y: 134, w, h: 42, bump: 0, uses: TUNING.salsaUses, refill: 0 }));
}
const _unusedBins = ['pastor'].map((id, i) => ({
  id, x: 54 + i * 88, y: 134, w: 82, h: 42, bump: 0, uses: TUNING.salsaUses, refill: 0,
}));
const PAUSE_BTN = { x: 303, y: 0, w: 17, h: 13 };
const MUTE_BTN = { x: 285, y: 0, w: 17, h: 13 };

// --------------------------------------------------------------------------- orders
function specKey(s) {
  const d = DIFFS[diff];
  return s.meat + '|' + (s.p ? 1 : 0) + (d.tops ? '|' + (s.c ? 1 : 0) + (s.l ? 1 : 0) : '') + (d.salsa ? '|' + (s.salsa || '-') : '');
}
function genSpec(lv) {
  const meat = lv < 0 ? pick(['suadero', 'bistec']) : pick(MEATS), d = DIFFS[diff];
  let c = true, l = true, salsa = null;
  if (d.tops && lv >= 0) { const r = rnd(); if (r < 0.25) c = false; else if (r < 0.45) l = false; else if (r < 0.52) { c = false; l = false; } }
  if (d.salsa && lv >= 0) salsa = rnd() < 0.5 ? 'verde' : 'roja';
  return { meat, c, l, salsa, p: meat === 'pastor' ? rnd() < 0.85 : rnd() < 0.25 };
}

// --------------------------------------------------------------------------- pools
const MAXP = 500, parts = [];
for (let i = 0; i < MAXP; i++) parts.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 0, max: 1, color: '#fff', size: 1 });
let pIdx = 0;
function emit(x, y, n, color, o) {
  o = o || {};
  for (let k = 0; k < n; k++) {
    const p = parts[pIdx]; pIdx = (pIdx + 1) % MAXP;
    const a = o.angle !== undefined ? o.angle + rr(-o.spread, o.spread) : rr(0, 6.283);
    const sp = rr(o.speedMin || 15, o.speed || 60);
    p.on = true; p.x = x; p.y = y; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
    p.g = o.g === undefined ? 160 : o.g; p.life = p.max = rr(0.3, o.life || 0.7);
    p.color = Array.isArray(color) ? pick(color) : color; p.size = o.size || (rnd() < 0.3 ? 2 : 1);
  }
}
const MAXT = 30, pops = [];
for (let i = 0; i < MAXT; i++) pops.push({ on: false, x: 0, y: 0, vy: 0, life: 0, max: 1, text: '', color: '#fff', size: 8 });
let popIdx = 0;
function popText(x, y, text, color, size, life) {
  const p = pops[popIdx]; popIdx = (popIdx + 1) % MAXT;
  p.on = true; p.x = x; p.y = y; p.vy = -18; p.life = p.max = life || 1; p.text = text; p.color = color || '#fff'; p.size = size || 8;
}

// --------------------------------------------------------------------------- state
const S = {
  fever: false,
  mode: 'title', time: 0, tips: 0, strikes: 0, combo: 0, bestCombo: 0, served: 0, pinas: 0, wrong: 0, burnt: 0,
  custTimer: 1, nextCustId: 1, customers: [], comal: [], board: null, pina: null, flies: [],
  shake: 0, hitstop: 0, flash: 0, darkTimer: 0, dark: 0, eventTimer: 20, eventText: '', eventT: 0, rushShown: false,
  best: 0, newBest: false, paused: false, endReason: '', overT: 0, comboAt: 0, msg: '', msgT: 0,
};
try { S.best = +localStorage.getItem('taquerotron.best.' + diff) || 0; } catch (e) {}
const speedUp = () => Math.pow(1.20, Math.floor(S.time / 10)); // +20 % every 10 s, all difficulties
const shiftT = () => clamp(S.time / TUNING.shiftSeconds, 0, 1);
const level = () => S.time < 5 ? 0 : S.time < 15 ? 1 : 2;

function resetShift() {
  seed = (Date.now() & 0xffff) + 7;
  Object.assign(S, {
    best: (() => { try { return +localStorage.getItem('taquerotron.best.' + diff) || 0; } catch (e) { return 0; } })(),
    missedPina: false, lastStep: 0, lastShown: false, lastTick: 99, mode: 'play', fever: false, autoT: 0, autoPina: 0, time: 0, tips: 0, strikes: 0, combo: 0, bestCombo: 0, served: 0, pinas: 0, wrong: 0, burnt: 0,
    custTimer: 0.6, nextCustId: 1, customers: [], board: null, pina: null, flies: [], shake: 0, hitstop: 0, flash: 0,
    darkTimer: 0, dark: 0, eventTimer: 26, eventText: '', eventT: 0, rushShown: false, newBest: false,
    paused: false, endReason: '', overT: 0, msg: '', msgT: 0,
  });
  setupBins();
  S.comal = COMAL.spots.map((x, i) => ({ x, heat: TUNING.tortillaReady + 0.3 - i * 0.6, on: true, respawn: 0 }));
  for (const b of BINS) { b.uses = TUNING.salsaUses; b.refill = 0; b.bump = 0; }
  for (const p of parts) p.on = false;
  for (const p of pops) p.on = false;
}
const learned = {};
function say(text, t) { S.msg = text; S.msgT = t || 1.4; }

// --------------------------------------------------------------------------- customers
const SHIRTS = ['#29adff', '#ff77a8', '#ffa300', '#00e436', '#83769c', '#ff004d', '#1d6bd6', '#c2c3c7'];
const SKINS = ['#ffccaa', '#e0a679', '#b97a4c', '#8a5634', '#f2c49b'];
const HAIRS = ['#1a1010', '#3b2416', '#5f3a22', '#0e0e14', '#a7a7b0', '#c84b1a'];
const BARKS_OK = ['¡GRACIAS!', '¡QUÉ RICO!', '¡ESO!', '¡BUENÍSIMO!', '¡AHÍ PA LA OTRA!'];
const BARKS_WRONG = ['¡ESO NO PEDÍ!', '¿Y MI TACO?', 'NO ES MÍO', '¡JOVEN!'];
const BARKS_ANGRY = ['¡ME VOY!', '¡QUÉ SERVICIO!', '¡AL DE ENFRENTE!'];
const BARKS_BONK = ['¡AY!', '¡LA PIÑA!', '¡AUCH!'];

function spawnCustomer() {
  const cap = S.time < 4 ? 1 : S.time < 10 ? 2 : S.time < 18 ? 3 : 4; // the last 10 s refill every free slot fast
  if (S.customers.filter(c => c.mood === 'wait').length >= cap) return false;
  const free = [0, 1, 2, 3].filter(i => !S.customers.some(c => c.slot === i));
  if (!free.length) return false;
  const slot = pick(free);
  const lv = S.nextCustId <= 2 ? -1 : level();
  const n = lv >= 2 ? (rnd() < 0.4 ? 3 : 2) : lv >= 1 ? (rnd() < 0.6 ? 2 : 1) : 1;
  const items = [];
  for (let i = 0; i < n; i++) {
    const s = genSpec(lv), k = specKey(s);
    const ex = items.find(it => it.key === k);
    if (ex) ex.qty++; else if (items.length < 2) items.push({ spec: s, key: k, qty: 1, done: 0 });
    else items[0].qty++; // tickets stay at two rows
  }
  const total = items.reduce((a, b) => a + b.qty, 0);
  const pat = TUNING.patienceStart + DIFFS[diff].pat + (total - 1) * (TUNING.patiencePerExtraTaco + DIFFS[diff].pat * 0.4);
  S.customers.push({
    id: S.nextCustId++, slot, x: SLOTS[slot], enter: 0, leave: 0, mood: 'wait', items, total,
    patience: pat, maxPat: pat, shirt: pick(SHIRTS), skin: pick(SKINS), hair: pick(HAIRS), style: ri(0, 3),
    bump: 0, bob: rr(0, 6), say: '', sayT: 0, glasses: rnd() < 0.25,
  });
  return true;
}
function compat(b, s) {
  const d = DIFFS[diff];
  if (b.meat && b.meat !== s.meat) return false;
  if (b.p && !s.p) return false;
  if (d.tops && ((b.c && !s.c) || (b.l && !s.l))) return false;
  if (b.salsa && b.salsa !== s.salsa) return false;
  return true;
}
function boardEmpty(b) { return !b || (!b.meat && !b.p && !b.salsa && (!DIFFS[diff].tops || (!b.c && !b.l))); }
function custWants(c, b) { return c.mood === 'wait' && c.items.some(it => it.done < it.qty && compat(b, it.spec)); }
function nobodyWants() { const b = S.board; return !!b && !boardEmpty(b) && !S.customers.some(c => custWants(c, b)); }
function custSay(c, t, d) { c.say = t; c.sayT = d || 1.4; }
function custAt(x, y) {
  for (const c of S.customers) if (c.mood === 'wait' && Math.abs(x - c.x) < 26 && y > 8 && y < 92) return c;
  return null;
}

// --------------------------------------------------------------------------- actions
function nope(t) { sfx.nope(); if (t) say(t, 1.1); }
function takeTortilla(spot) {
  if (S.board) { nope(); return; }
  let s = spot;
  if (!s) { // keyboard: the hottest ready one, else clear a burnt one
    const ready = S.comal.filter(t => t.on && t.heat >= TUNING.tortillaReady && t.heat < TUNING.tortillaBurn);
    if (ready.length) s = ready.sort((a, b) => b.heat - a.heat)[0];
    else { const burnt = S.comal.find(t => t.on && t.heat >= TUNING.tortillaBurn); if (burnt) { clearBurnt(burnt); return; } nope('ESPERA QUE SE CALIENTE'); return; }
  }
  if (!s.on) return;
  if (s.heat >= TUNING.tortillaBurn) { clearBurnt(s); return; }
  if (s.heat < TUNING.tortillaReady) { nope('AÚN ESTÁ FRÍA'); return; }
  learned.tortilla = true; S.missedPina = false;
  s.on = false; s.respawn = TUNING.tortillaRespawn;
  S.board = { meat: null, c: false, l: false, salsa: null, p: false, bump: 1 };
  S.flies.push({ x0: s.x, y0: COMAL.sy, x1: BOARD.cx, y1: BOARD.cy, t: 0, color: '#f3d38a', taco: true });
  sfx.plop('top');
}
function clearBurnt(s) {
  learned.burnt = true;
  s.on = false; s.respawn = TUNING.tortillaRespawn;
  S.tips = Math.max(0, S.tips - TUNING.burnPenalty);
  emit(s.x, COMAL.sy, 10, ['#3b2a20', '#5f574f', '#1a1010'], { angle: -1.57, spread: 0.8, speed: 50, g: -20, life: 1 });
  popText(s.x, COMAL.sy - 8, '-$' + TUNING.burnPenalty, '#ff6b6b', 7, 0.8);
  sfx.trash();
}
function addIng(id, fx, fy) {
  const b = S.board;
  if (!b) { nope('PRIMERO TOMA UNA TORTILLA (T)'); return false; }
  const kind = KIND[id];
  if (kind === 'meat') { if (b.meat) { nope('YA TIENE CARNE'); return false; } b.meat = id; if (!DIFFS[diff].tops) { b.c = true; b.l = true; } }
  else if (id === 'cebolla') { if (b.c) { nope(); return false; } b.c = true; }
  else if (id === 'cilantro') { if (b.l) { nope(); return false; } b.l = true; }
  else if (kind === 'salsa') {
    if (b.salsa) { nope('YA TIENE SALSA'); return false; }
    const bin = BINS.find(x => x.id === id);
    if (bin.refill > 0) { nope(); return false; }
    if (bin.uses <= 0) { startRefill(bin); return false; }
    bin.uses--; b.salsa = id;
    if (bin.uses <= 0) popText(bin.x + 20, bin.y - 2, '¡VACÍA!', '#ffec27', 7, 1);
  }
  learned[KIND[id] === 'salsa' ? 'salsa' : id] = true;
  b.bump = 1;
  S.flies.push({ x0: fx, y0: fy, x1: BOARD.cx + rr(-8, 8), y1: BOARD.cy, t: 0, icon: id });
  const col = CHUNK[id] || [ICON[id].pal[1], ICON[id].pal[2]];
  emit(BOARD.cx, BOARD.cy - 2, 8, col, { angle: -1.57, spread: 1.1, speed: 55 });
  sfx.plop(kind);
  return true;
}
function conTodo() {
  const b = S.board;
  if (!b) { nope('PRIMERO LA TORTILLA'); return; }
  if (b.c && b.l) { nope('YA VA CON TODO'); return; }
  learned.contodo = true;
  if (!DIFFS[diff].tops) return;
  const bc = BINS.find(x => x.id === 'cebolla'), bl = BINS.find(x => x.id === 'cilantro');
  if (!b.c) addIng('cebolla', bc.x + 10, bc.y + 10);
  if (!b.l) addIng('cilantro', bl.x + 10, bl.y + 10);
}
function startRefill(bin) { if (bin.refill > 0 || bin.uses > 0) return; bin.refill = TUNING.salsaRefill; bin.bump = 1; sfx.refill(); }
function carve() {
  TROMPO.bump = 1; sfx.chop();
  emit(TROMPO.x + 30, TROMPO.y + 40, 6, CHUNK.pastor, { angle: 0, spread: 0.6, speed: 60 });
  addIng('pastor', TROMPO.x + 30, TROMPO.y + 40);
}
function launchPina() {
  if (S.pina) return;
  if (!S.board) { nope('PRIMERO LA TORTILLA'); return; }
  if (S.board.p) { nope('YA TIENE PIÑA'); return; }
  TROMPO.bump = 0.7;
  const pb = BINS.find(b => b.id === 'pina'), fromBin = S.pinaFromBin; S.pinaFromBin = false;
  S.pina = { t: 0, x0: fromBin && pb ? pb.x + pb.w / 2 : PINA_SPOT.x, y0: fromBin && pb ? pb.y : PINA_SPOT.y - 6, x: 0, y: 0, state: 'land' };

    if (S.eventT > 0) { const a = Math.min(1, S.eventT * 2), sc = 1 + Math.max(0, S.eventT - 1.6) * 1.5; ctx.globalAlpha = a; ctx.save(); ctx.translate(160, 64); ctx.scale(sc, sc); txt(S.eventText, 0, 0, 14, '#ffec27'); ctx.restore(); ctx.globalAlpha = 1; }
  }
  for (const q of pops) if (q.on) { const a = q.life / q.max; ctx.globalAlpha = a < 0.35 ? a / 0.35 : 1; const sc = 1 + Math.max(0, a - 0.8) * 2.5; ctx.save(); ctx.translate(q.x, q.y); ctx.scale(sc, sc); txt(q.text, 0, 0, q.size, q.color); ctx.restore(); }
  ctx.globalAlpha = 1;
  if (S.mode === 'closing') {
    const red = (R(S.closeT * 7) % 2) === 0;
    ctx.fillStyle = red ? 'rgba(255,0,77,0.22)' : 'rgba(41,85,255,0.22)'; ctx.fillRect(0, 0, 320, 180);
    ctx.fillStyle = red ? '#ff004d' : '#2b55ff'; ctx.fillRect(0, 0, 320, 3); ctx.fillRect(0, 177, 320, 3);
    txt('¡LLEGÓ LA POLICÍA!', 160, 28, 12, '#fff1e8');
    if (S.stamped) {
      const k = Math.max(1, 2.2 - (S.closeT - 1.6) * 8);
      ctx.save(); ctx.translate(160, 92); ctx.rotate(-0.18); ctx.scale(k, k);
      ctx.strokeStyle = '#ff004d'; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(255,241,232,0.92)'; ctx.fillRect(-82, -20, 164, 40); ctx.strokeRect(-82, -20, 164, 40);
      txt('CLAUSURADO', 0, -3, 22, '#ff004d', 'center', false); txt('5 CLIENTES ENOJADOS', 0, 13, 6.5, '#1a1010', 'center', false);
      ctx.restore();
    }
  }
  if (S.mode === 'title') drawTitle();
  if (S.mode === 'over') drawOver();
  if (window.innerHeight > window.innerWidth * 1.1) { ctx.fillStyle = '#0e0b1af0'; ctx.fillRect(0, 0, 320, 180); txt('GIRA TU TELÉFONO', 160, 80, 22, '#ffec27'); txt('TAQUETRÓN SE JUEGA ACOSTADO', 160, 104, 9, '#fff1e8'); }
  if (S.paused && S.mode === 'play') {
    ctx.fillStyle = '#0e0b1ad0'; ctx.fillRect(0, 0, 320, 180);
    txt('PAUSA', 160, 46, 24, '#ffec27');
    PAUSE_MENU().forEach(b => { ctx.fillStyle = b.main ? '#00e436' : '#33262e'; ctx.fillRect(b.x, b.y, b.w, b.h); txt(b.label(), b.x + b.w / 2, b.y + b.h / 2 + 0.5, 8, b.main ? '#1a1010' : '#fff1e8', 'center', false); });
  }
}
function sprCtx(map, pal, x, y, sc) { for (let j = 0; j < map.length; j++) for (let i = 0; i < map[j].length; i++) { const ch = map[j][i]; if (ch === '.') continue; ctx.fillStyle = pal[ch]; ctx.fillRect(x + i * sc, y + j * sc, sc + 0.05, sc + 0.05); } }
function drawTitle() {
  ctx.fillStyle = '#0e0b1ab8'; ctx.fillRect(0, 0, 320, 180);
  const b = Math.sin(gameTime * 3) * 1.5;
  ctx.save(); ctx.translate(160, 46 + b); ctx.rotate(-0.04); txt('TAQUETRÓN', 0, 0, 36, '#ffec27'); ctx.restore();
  txt('¿CUÁNTOS TACOS SACAS EN 30 SEGUNDOS?', 160, 72, 7, '#fff1e8'); txt('5 CLIENTES ENOJADOS Y TE CIERRAN', 160, 81, 5.5, '#ff77a8');

  Object.keys(DIFFS).forEach((k, i) => { const r = DIFF_BTN(i), on = k === diff, d = DIFFS[k];
    ctx.fillStyle = on ? '#00e436' : '#33262e'; ctx.fillRect(r.x, r.y, r.w, r.h);
    txt((i + 1) + ' ' + d.label, r.x + r.w / 2, r.y + 8, 9, on ? '#1a1010' : '#fff1e8', 'center', false);
    const ids = d.bins, iw = 7.5, x0 = r.x + r.w / 2 - ids.length * iw / 2; ids.forEach((id, j) => sprCtx(ICON[id].map, ICON[id].pal, x0 + j * iw, r.y + 14, 0.85)); });
  ctx.globalAlpha = 0.7 + Math.sin(gameTime * 5) * 0.3; txt('TOCA UNA PARA EMPEZAR', 160, 134, 7, '#00e436'); ctx.globalAlpha = 1;

  if (board.top.length) { ctx.fillStyle = '#0e0b1ad0'; ctx.fillRect(250, 128, 68, 52); drawTopMini(284, 134); }
  if (selfTest.done) txt((selfTest.ok ? 'AUTOPRUEBA OK ' : 'AUTOPRUEBA FALLA ') + selfTest.pass + '/' + selfTest.total, 4, 175, 4.5, selfTest.ok ? '#00e436' : '#ff004d', 'left', false);
}
function drawTopMini(x, y) { txt('TOP ' + DIFFS[diff].label, x, y, 6, '#ff77a8'); board.top.slice(0, 5).forEach((r, i) => txt((i + 1) + '. ' + r.name + ' $' + r.score, x, y + 8 + i * 7, 5.2, i === 0 ? '#ffec27' : '#fff1e8')); }
function drawTop(x, y, highlight) {
  txt('TOP 10 · ' + DIFFS[diff].label, x, y, 7, '#ff77a8');
  if (!board.top.length) { txt('SÉ EL PRIMERO', x, y + 12, 6, '#c2c3c7'); return; }
  board.top.forEach((r, i) => { const me = highlight && r.name === board.name && r.score === S.tips; txt((i + 1 + '.').padEnd(3) + ' ' + r.name + '  $' + r.score, x, y + 10 + i * 7.5, 5.8, me ? '#00e436' : i === 0 ? '#ffec27' : '#fff1e8'); });
}
function drawOver() {
  const a = Math.min(1, S.overT * 3); ctx.globalAlpha = a;
  ctx.fillStyle = '#0e0b1ae8'; ctx.fillRect(0, 0, 320, 180);
  const closed = S.endReason === 'closed';
  txt(closed ? '¡5 ENOJADOS! TE CERRARON' : '¡SE ACABARON LOS 30 SEGUNDOS!', 160, 18, 11, closed ? '#ff004d' : '#ffec27');
  txt('$' + S.tips, 88, 46, 24, '#ffec27'); txt('EN PROPINAS', 88, 62, 6, '#fff1e8');
  txt(rankFor(S.tips), 88, 75, 8, '#00e436');
  if (S.newBest) txt('¡NUEVO RÉCORD!', 88, 87, 7, '#ff77a8'); else txt('TU RÉCORD: $' + S.best, 88, 87, 6, '#fff1e8');
  if (!board.entering) txt(S.served + ' TACOS EN ' + Math.round(Math.min(S.time, TUNING.shiftSeconds)) + ' SEGUNDOS · RACHA ' + S.bestCombo, 88, 98, 5.5, '#ffccaa');
  if (board.entering) {
    txt('TU NOMBRE PARA EL TOP 10', 88, 106, 6.5, '#fff1e8');
    for (let i = 0; i < 3; i++) {
      const b = NAME_UI.box(i), ch = board.name[i] || ((R(gameTime * 3) % 2 && i === board.name.length) ? '_' : ' ');
      txt('▲', b.x + 6.5, b.y - 5, 6, '#83769c', 'center', false); txt('▼', b.x + 6.5, b.y + b.h + 5, 6, '#83769c', 'center', false);
      ctx.fillStyle = '#1a1010'; ctx.fillRect(b.x, b.y, b.w, b.h); txt(ch, b.x + 6.5, b.y + 8, 12, '#ffec27', 'center', false);
    }
    const ok = board.name.length === 3, sv = NAME_UI.save, sk = NAME_UI.skip;
    ctx.fillStyle = ok ? '#00e436' : '#5f574f'; ctx.fillRect(sv.x, sv.y, sv.w, sv.h); txt('GUARDAR', sv.x + sv.w / 2, sv.y + 9, 6.5, '#1a1010', 'center', false);

  } else if (board.sent) {
    txt(board.rank ? 'LUGAR #' + board.rank : board.err || 'GUARDANDO…', 88, 122, 10, board.rank && board.rank <= 10 ? '#00e436' : '#fff1e8');
  }
  drawTop(240, 40, true);
  if (S.overT > 0.5) OVER_BTNS.forEach(b => { ctx.fillStyle = b.main ? '#00e436' : '#33262e'; ctx.fillRect(b.x, b.y, b.w, b.h); txt(b.label, b.x + b.w / 2, b.y + b.h / 2 + 0.5, 7, b.main ? '#1a1010' : '#fff1e8', 'center', false); });
  ctx.globalAlpha = 1;
}

// --------------------------------------------------------------------------- self-test
const selfTest = { done: false, ok: false, pass: 0, total: 1000 };
function runSelfTest() {
  const saved = seed; let pass = 0;
  for (let i = 0; i < selfTest.total; i++) {
    seed = 1000 + i; const s = genSpec((i % 4) - 1);
    const t = { meat: s.meat, c: s.c, l: s.l, salsa: s.salsa, p: s.p };
    if (MEATS.includes(s.meat) && specKey(t) === specKey(s)) pass++;
  }
  seed = saved; selfTest.pass = pass; selfTest.ok = pass === selfTest.total; selfTest.done = true;
}

// --------------------------------------------------------------------------- loop
const STEP = 1 / 120;
let acc = 0, lastTs = 0;
const fps = { frames: 0, t: 0, value: 0, renderMs: 0 };
function frame(ts) {
  const dt = Math.min(0.1, lastTs ? (ts - lastTs) / 1000 : 0); lastTs = ts;
  fps.frames++; fps.t += dt; if (fps.t >= 1) { fps.value = fps.frames / fps.t; fps.frames = 0; fps.t = 0; }
  gameTime += dt;
  if (!S.paused) { if (S.hitstop > 0) S.hitstop -= dt; else { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } } }
  const r0 = performance.now(); render(); const rm = performance.now() - r0; fps.renderMs = fps.renderMs ? fps.renderMs * 0.95 + rm * 0.05 : rm;
  requestAnimationFrame(frame);
}
window.__T = {
  noise: () => noiseCount, musicOn: () => music.on && !!AC,
  setDiff: k => { diff = k; },
  S, TUNING, selfTest, fps,
  start: () => resetShift(),
  step(seconds, bot) { const n = Math.round(seconds / STEP); for (let i = 0; i < n; i++) { if (bot && i % 8 === 0) bot(); update(STEP); if (S.mode === 'over' || S.mode === 'title') break; } return S.mode; },
  // bot: serves the most impatient customer it can complete
  bot() {
    if (S.pina) return;
    const cs = S.customers.filter(c => c.mood === 'wait').sort((a, b) => a.patience - b.patience);
    if (!cs.length) return;
    const b = S.board;
    if (!b) { const t = S.comal.find(t => t.on && t.heat >= TUNING.tortillaReady && t.heat < TUNING.tortillaBurn); if (t) takeTortilla(t); else { const bt = S.comal.find(t => t.on && t.heat >= TUNING.tortillaBurn); if (bt) clearBurnt(bt); } return; }
    for (const c of cs) for (const it of c.items) {
      if (it.done >= it.qty) continue; const s = it.spec;
      const d = DIFFS[diff];
      if ((b.meat && b.meat !== s.meat) || (b.p && !s.p) || (d.tops && ((b.c && !s.c) || (b.l && !s.l))) || (d.salsa && b.salsa && b.salsa !== s.salsa)) continue;
      if (!b.meat) { addIng(s.meat, 0, 0); return; }
      if (d.tops && s.c && !b.c) { addIng('cebolla', 0, 0); return; }
      if (d.tops && s.l && !b.l) { addIng('cilantro', 0, 0); return; }
      if (d.salsa && s.salsa && !b.salsa) { addIng(s.salsa, 0, 0); return; }
      if (s.p && !b.p) { launchPina(); return; }
      serveTo(c); return;
    }
    trashBoard();
  },
};
setupBins(); resize(); runSelfTest(); loadTop(); setInterval(() => { if (S.mode !== 'play') loadTop(); }, 15000); requestAnimationFrame(frame);
</script>
